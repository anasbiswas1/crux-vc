name: CRUX-VC validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validation environment
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Static repository validation
        run: python tools/validate_repo.py
      - name: Unit and synthetic tests
        run: pytest -q
